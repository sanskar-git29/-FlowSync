version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports: ['80:80']
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: production }
    env_file: .env
    expose: ['3000', '9090']
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      retries: 3

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: production }
    command: node dist/workers/worker.js
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  ws:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: production }
    command: node dist/ws-server.js
    env_file: .env
    expose: ['4000']
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment: { POSTGRES_DB: '${DB_NAME}', POSTGRES_USER: '${DB_USER}', POSTGRES_PASSWORD: '${DB_PASSWORD}' }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s;
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    expose: ['9090']

  grafana:
    image: grafana/grafana:latest
    ports: ['3001:3000']
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin }
    depends_on: [prometheus]

volumes:
  postgres_data:
  redis_data: